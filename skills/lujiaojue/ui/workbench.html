<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小鹿工作台</title>
<style>
:root{--ink:#162019;--muted:#6b746d;--bg:#f2f3ed;--card:#fcfcf8;--line:rgba(25,55,36,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1120px;margin:0 auto;padding:44px 28px 70px}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}
h1{font-size:34px;margin:0}.folder{color:var(--muted);font-size:13px}
.primary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.value-block{min-height:150px;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.label{font-size:12px;color:var(--muted);margin-bottom:16px}.value{font-size:22px;line-height:1.35;font-weight:650}
.sub{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
.secondary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.secondary .value-block{min-height:120px}.secondary .value{font-size:18px}
.empty{padding:24px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
footer{margin-top:26px;color:#848b85;font-size:11px}
@media(max-width:900px){.primary,.secondary{grid-template-columns:1fr 1fr}}
@media(max-width:580px){.primary,.secondary{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><h1>小鹿工作台</h1><div class="folder">{{FOLDER_NAME}}</div></header>
<section class="primary">{{PRIMARY}}</section>
<section class="secondary">{{SECONDARY}}</section>
<footer>{{GENERATED_AT}}</footer>
</main>
</body>
</html>
